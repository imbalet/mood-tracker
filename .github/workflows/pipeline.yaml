name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref_name }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v7.3.0

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: All lints
        run: make lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v7.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            fontconfig

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: make test-unit

      - name: Run integration tests
        env:
          PYTHONIOENCODING: utf-8
          TEST_DATABASE_URL: postgresql+asyncpg://mood_tracker_test:mood_tracker_test@localhost:5432/mood_tracker_test
        run: make test-integration

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      full_image: ${{ steps.full-image.outputs.full_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Log in to the Container registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Set full image with SHA
        id: full-image
        run: |
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          echo "full_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          LOG_LEVEL=${{ vars.LOG_LEVEL }}
          DB_PASS=${{ secrets.DB_PASS }}
          EOF

      - name: Backup current deployment on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BACKUP_DIR=~/backups_mood_tracker/$(date +%Y%m%d_%H%M%S)
            mkdir -p ~/backups_mood_tracker
            if [ -d ~/app_mood_tracker ]; then
              cp -r ~/app_mood_tracker "$BACKUP_DIR"
              echo "Backup created: $BACKUP_DIR"
              ls -dt ~/backups_mood_tracker/*/ | tail -n +6 | xargs rm -rf
            else
              echo "No existing deployment to backup"
            fi

      - name: Copy deployment files via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,.env"
          target: "~/app_mood_tracker"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ needs.build.outputs.full_image }}"
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock
            cd ~/app_mood_tracker
            IMAGE=${{ needs.build.outputs.full_image }} docker compose --env-file .env up -d --force-recreate
